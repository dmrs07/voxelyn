name: Apply Survival Redesign

on:
  push:
    branches:
      - feat/survival-salvage-modules
    paths:
      - .github/patches/READY

permissions:
  contents: write

concurrency:
  group: survival-redesign-apply
  cancel-in-progress: false

jobs:
  apply-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/survival-salvage-modules
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Apply logical slices
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for prefix in 01-sim 02-protocol-server 03-ui-content; do
            cat .github/patches/${prefix}.*.part > "/tmp/${prefix}.patch.gz.b64"
            base64 --decode "/tmp/${prefix}.patch.gz.b64" | gzip --decompress > "/tmp/${prefix}.patch"
            git apply --index "/tmp/${prefix}.patch"
            case "$prefix" in
              01-sim) message="feat(survival): add temporary modules and salvage simulation" ;;
              02-protocol-server) message="feat(survival): synchronize per-player choices and world flags" ;;
              03-ui-content) message="feat(survival-ui): add salvage props, reward choice and module HUD" ;;
            esac
            git commit -m "$message"
          done

      - name: Generate content atlases
        run: pnpm --filter @voxelyn/survival-content generate

      - name: Test Survival workspace
        run: pnpm test:survival

      - name: Commit generated assets and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add packages/voxelyn-survival-content/assets/atlases/world-props.json \
                  packages/voxelyn-survival-content/assets/atlases/world-props.png \
                  packages/voxelyn-survival-content/assets/atlases/index.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(survival-content): regenerate salvage prop atlas"
          fi
          git rm -r .github/patches
          git rm .github/workflows/materialize-survival-worktree.yml
          git rm .github/workflows/apply-survival-redesign.yml
          git commit -m "chore: remove temporary survival workflows"
          git push origin HEAD:feat/survival-salvage-modules
