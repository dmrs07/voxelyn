name: Apply death echo refactor

on:
  push:
    branches:
      - feat/survival-death-echoes
    paths:
      - .github/workflows/apply-death-echo-refactor.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/survival-death-echoes
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply deterministic refactor
        run: node .github/scripts/apply-death-echo-refactor.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Survival
        run: |
          pnpm build:survival
          pnpm test:survival
          pnpm --filter @voxelyn/survival build:offline-check
          git diff --check

      - name: Publish clean feature commit
        run: |
          rm .github/scripts/apply-death-echo-refactor.mjs
          rm .github/workflows/apply-death-echo-refactor.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(survival): integrate death echoes into world renderer"
          git push origin HEAD:feat/survival-death-echoes
