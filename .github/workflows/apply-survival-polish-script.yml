name: Apply Corrected Survival Reward Polish

on:
  push:
    branches:
      - feat/survival-salvage-modules
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: corrected-survival-reward-polish
  cancel-in-progress: true

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/survival-salvage-modules
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Apply polish script and fix numeric endpoint assertion
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/polish-survival-reward.yml').read_text()
          marker = "          python <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          Path('/tmp/polish.py').write_text(dedent(workflow[start:end]))
          PY
          python /tmp/polish.py
          python <<'PY'
          from pathlib import Path

          path = Path('packages/voxelyn-survival/src/tests/module-layout.test.ts')
          text = path.read_text()
          old = "    expect(rewardFlightPosition(from, to, 900, 650)).toEqual({ ...to, progress: 1 });"
          new = (
              "    const end = rewardFlightPosition(from, to, 900, 650);\n"
              "    expect(end.x).toBeCloseTo(to.x);\n"
              "    expect(end.y).toBeCloseTo(to.y);\n"
              "    expect(end.progress).toBe(1);"
          )
          if old not in text:
              raise SystemExit('Generated endpoint assertion was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Build and test corrected client polish
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @voxelyn/core build 2>&1 | tee /tmp/polish.log
          pnpm --filter @voxelyn/survival-sim build 2>&1 | tee -a /tmp/polish.log
          pnpm --filter @voxelyn/survival-protocol build 2>&1 | tee -a /tmp/polish.log
          pnpm --filter @voxelyn/survival test 2>&1 | tee -a /tmp/polish.log
          pnpm --filter @voxelyn/survival build:offline-check 2>&1 | tee -a /tmp/polish.log

      - name: Commit corrected client polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/voxelyn-survival/src/client/module-layout.ts \
                  packages/voxelyn-survival/src/client/input.ts \
                  packages/voxelyn-survival/src/client/render.ts \
                  packages/voxelyn-survival/src/client/main.ts \
                  packages/voxelyn-survival/src/tests/module-layout.test.ts
          git commit -m "feat(survival-ui): animate purge cell reward reveal"
          git rm .github/workflows/polish-survival-reward.yml \
                 .github/workflows/apply-survival-polish-script.yml
          git commit -m "chore: remove temporary reward polish workflows"
          git push origin HEAD:feat/survival-salvage-modules
