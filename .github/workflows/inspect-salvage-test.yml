name: Inspect Salvage Test

on:
  push:
    branches:
      - feat/survival-salvage-modules

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: survival-salvage-inspect
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/survival-salvage-modules

      - name: Materialize simulation slice
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/01-sim.*.part > /tmp/01-sim.patch.gz.b64
          echo '2c7afa3fc6300b73b8c714968eef35b8b05aedb34e492df0b643d67ce23c3f60  /tmp/01-sim.patch.gz.b64' | sha256sum --check
          base64 --decode /tmp/01-sim.patch.gz.b64 | gzip --decompress > /tmp/01-sim.patch
          git apply /tmp/01-sim.patch

      - name: Apply current fixture corrections
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('packages/voxelyn-survival-sim/tests/salvage-modules.test.ts')
          text = path.read_text()
          replacements = {
              "    const enemy = spawnEnemy(state, 'bruiser', state.player.x + 0.2, state.player.y, false);": "    const enemy = spawnEnemy(state, 'bruiser', state.player.x + 0.2, state.player.y, false);\n    enemy.x = state.player.x + 0.2;\n    enemy.y = state.player.y;\n    enemy.stunnedUntil = Number.MAX_SAFE_INTEGER;",
              "    spawnEnemy(before, 'bruiser', before.player.x, before.player.y, false);": "    const beforeEnemy = spawnEnemy(before, 'bruiser', before.player.x, before.player.y, false);\n    beforeEnemy.x = before.player.x;\n    beforeEnemy.y = before.player.y;\n    beforeEnemy.stunnedUntil = Number.MAX_SAFE_INTEGER;",
              "    spawnEnemy(armed, 'bruiser', armed.player.x, armed.player.y, false);": "    const armedEnemy = spawnEnemy(armed, 'bruiser', armed.player.x, armed.player.y, false);\n    armedEnemy.x = armed.player.x;\n    armedEnemy.y = armed.player.y;\n    armedEnemy.stunnedUntil = Number.MAX_SAFE_INTEGER;",
              "    while (state.tick < first.scanEndsAt) stepRun(state, [emptyCommand()]);": "    while (state.tick < first.scanEndsAt) {\n      state.enemies = [];\n      state.player.hp = state.player.maxHp;\n      stepRun(state, [emptyCommand()]);\n    }",
          }
          for old, new in replacements.items():
              if old in text and new not in text:
                  text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Publish test tail
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'Materialized `salvage-modules.test.ts` tail:'
            echo
            echo '```ts'
            nl -ba packages/voxelyn-survival-sim/tests/salvage-modules.test.ts | tail -n 180
            echo '```'
          } > /tmp/inspection.md
          gh api --method PATCH repos/dmrs07/voxelyn/issues/comments/5097223897 -F body=@/tmp/inspection.md
