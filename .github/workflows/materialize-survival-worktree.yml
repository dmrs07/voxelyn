name: Finalize Survival Redesign

on:
  push:
    branches:
      - feat/survival-salvage-modules

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: survival-redesign-finalize
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/survival-salvage-modules
          fetch-depth: 0

      - name: Report validation start
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '🔎 Final Survival validation started for `%s`: %s\n' "${GITHUB_SHA::12}" "$RUN_URL" > /tmp/status.md
          gh api --method PATCH repos/dmrs07/voxelyn/issues/comments/5097222729 -F body=@/tmp/status.md

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Apply logical slices
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for prefix in 01-sim 02-protocol-server 03-ui-content; do
            cat .github/patches/${prefix}.*.part > "/tmp/${prefix}.patch.gz.b64"
            case "$prefix" in
              01-sim)
                expected="2c7afa3fc6300b73b8c714968eef35b8b05aedb34e492df0b643d67ce23c3f60"
                message="feat(survival): add temporary modules and salvage simulation"
                ;;
              02-protocol-server)
                expected="fc26e4978d5ff097b4ab640bd0ebeab4c64331ad7bfc695f9b0fa7d21b25b4f9"
                message="feat(survival): synchronize per-player choices and world flags"
                ;;
              03-ui-content)
                expected="eda0ca30411e0e7982c3af3ebe0dcbdf359352e4083280aaa7b36c0345fe059d"
                message="feat(survival-ui): add salvage props, reward choice and module HUD"
                ;;
            esac
            echo "$expected  /tmp/${prefix}.patch.gz.b64" | sha256sum --check
            base64 --decode "/tmp/${prefix}.patch.gz.b64" | gzip --decompress > "/tmp/${prefix}.patch"
            git apply --index "/tmp/${prefix}.patch"
            git commit -m "$message"
          done

      - name: Apply deterministic corrections
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          cells_path = Path('packages/voxelyn-survival-sim/src/cells.ts')
          cells = cells_path.read_text()
          event = "  events.push({ t: 'discharge', cells, ...origin });"
          duplicate = f"{event}\n{event}"
          if duplicate in cells:
              cells = cells.replace(duplicate, event, 1)
              cells_path.write_text(cells)
          elif cells.count(event) != 1:
              raise SystemExit('Unexpected discharge event shape in cells.ts')

          reactions_path = Path('packages/voxelyn-survival-sim/tests/reactions.test.ts')
          reactions = reactions_path.read_text()
          vent_filter = "  state.vents = state.vents.filter((vent) => vent.x < x0 || vent.x > x1 || vent.y < y0 || vent.y > y1);"
          if vent_filter not in reactions:
              needle = "  }\n};\n\nconst tickCells"
              replacement = (
                  "  }\n"
                  "  // Um cenário controlado não pode receber emissões de vents gerados pela seed.\n"
                  f"{vent_filter}\n"
                  "};\n\nconst tickCells"
              )
              if needle not in reactions:
                  raise SystemExit('Unexpected clearArea shape in reactions.test.ts')
              reactions = reactions.replace(needle, replacement, 1)
              reactions_path.write_text(reactions)

          salvage_path = Path('packages/voxelyn-survival-sim/tests/salvage-modules.test.ts')
          salvage = salvage_path.read_text()
          replacements = {
              "    const enemy = spawnEnemy(state, 'bruiser', state.player.x + 0.2, state.player.y, false);": (
                  "    const enemy = spawnEnemy(state, 'bruiser', state.player.x + 0.2, state.player.y, false);\n"
                  "    enemy.x = state.player.x + 0.2;\n"
                  "    enemy.y = state.player.y;\n"
                  "    enemy.stunnedUntil = Number.MAX_SAFE_INTEGER;"
              ),
              "    spawnEnemy(before, 'bruiser', before.player.x, before.player.y, false);": (
                  "    const beforeEnemy = spawnEnemy(before, 'bruiser', before.player.x, before.player.y, false);\n"
                  "    beforeEnemy.x = before.player.x;\n"
                  "    beforeEnemy.y = before.player.y;\n"
                  "    beforeEnemy.stunnedUntil = Number.MAX_SAFE_INTEGER;"
              ),
              "    spawnEnemy(armed, 'bruiser', armed.player.x, armed.player.y, false);": (
                  "    const armedEnemy = spawnEnemy(armed, 'bruiser', armed.player.x, armed.player.y, false);\n"
                  "    armedEnemy.x = armed.player.x;\n"
                  "    armedEnemy.y = armed.player.y;\n"
                  "    armedEnemy.stunnedUntil = Number.MAX_SAFE_INTEGER;"
              ),
              "    while (state.tick < first.scanEndsAt) stepRun(state, [emptyCommand()]);": (
                  "    while (state.tick < first.scanEndsAt) {\n"
                  "      state.enemies = [];\n"
                  "      state.player.hp = state.player.maxHp;\n"
                  "      stepRun(state, [emptyCommand()]);\n"
                  "    }"
              ),
          }
          for old, new in replacements.items():
              if new in salvage:
                  continue
              if old not in salvage:
                  raise SystemExit(f'Unexpected salvage fixture shape: {old}')
              salvage = salvage.replace(old, new, 1)
          salvage_path.write_text(salvage)

          protocol_test_path = Path('packages/voxelyn-survival-protocol/tests/validate.test.ts')
          protocol_test = protocol_test_path.read_text()
          old_keys = "['ability', 'aim', 'choose', 'consume', 'dodge', 'fire', 'interact', 'move']"
          new_keys = "['ability', 'aim', 'choose', 'dodge', 'fire', 'interact', 'move', 'purge']"
          if old_keys in protocol_test:
              protocol_test = protocol_test.replace(old_keys, new_keys, 1)
              protocol_test_path.write_text(protocol_test)
          elif new_keys not in protocol_test:
              raise SystemExit('Unexpected PlayerCommand key expectation in protocol test')

          server_test_path = Path('packages/voxelyn-survival-server/tests/server.test.ts')
          server_test = server_test_path.read_text()
          old_reconnect_fixture = (
              "    room.state.players[1].x = room.state.entry.x + 18;\n"
              "    room.state.players[1].y = room.state.entry.y + 12;\n"
              "    room.state.players[1].hp = 40;\n\n"
              "    h.disconnect('B');\n"
              "    h.tick(40); // blip curto, bem dentro do grace"
          )
          new_reconnect_fixture = (
              "    h.disconnect('B');\n"
              "    h.tick(40); // blip curto, bem dentro do grace\n\n"
              "    // Isola o invariante de reconnect do dano autoritativo que pode ocorrer offline.\n"
              "    room.state.players[1].x = room.state.entry.x + 18;\n"
              "    room.state.players[1].y = room.state.entry.y + 12;\n"
              "    room.state.players[1].hp = 40;"
          )
          if old_reconnect_fixture in server_test:
              server_test = server_test.replace(old_reconnect_fixture, new_reconnect_fixture, 1)
              server_test_path.write_text(server_test)
          elif new_reconnect_fixture not in server_test:
              raise SystemExit('Unexpected reconnect preservation fixture in server test')
          PY
          git add \
            packages/voxelyn-survival-sim/src/cells.ts \
            packages/voxelyn-survival-sim/tests/reactions.test.ts \
            packages/voxelyn-survival-sim/tests/salvage-modules.test.ts \
            packages/voxelyn-survival-protocol/tests/validate.test.ts \
            packages/voxelyn-survival-server/tests/server.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix(survival): isolate deterministic fixtures and protocol invariants"
          fi

      - name: Build dependency graph
        shell: bash
        run: |
          set -o pipefail
          {
            pnpm --filter @voxelyn/core build
            pnpm --filter @voxelyn/survival-sim build
            pnpm --filter @voxelyn/survival-protocol build
            pnpm --filter @voxelyn/survival-content generate
            pnpm --filter @voxelyn/survival-content validate
            pnpm --filter @voxelyn/survival-content build
            pnpm --filter @voxelyn/survival-server build
            pnpm --filter @voxelyn/survival build:offline-check
          } 2>&1 | tee /tmp/build.log

      - name: Test simulation files
        shell: bash
        run: |
          set -euo pipefail
          cd packages/voxelyn-survival-sim
          : > /tmp/test-sim.log
          for file in tests/*.test.ts; do
            echo "$file" > /tmp/test-sim-current
            echo "=== $file ===" | tee -a /tmp/test-sim.log
            timeout 90s pnpm exec vitest run "$file" --reporter=verbose 2>&1 | tee -a /tmp/test-sim.log
          done

      - name: Test protocol
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @voxelyn/survival-protocol test 2>&1 | tee /tmp/test-protocol.log

      - name: Test content pipeline
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @voxelyn/survival-content test 2>&1 | tee /tmp/test-content.log

      - name: Test server and co-op
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @voxelyn/survival-server test 2>&1 | tee /tmp/test-server.log

      - name: Test client and layouts
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @voxelyn/survival test 2>&1 | tee /tmp/test-client.log

      - name: Publish logical commits
        shell: bash
        run: |
          set -euo pipefail
          git add packages/voxelyn-survival-content/assets/atlases/world-props.json \
                  packages/voxelyn-survival-content/assets/atlases/world-props.png \
                  packages/voxelyn-survival-content/assets/atlases/index.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(survival-content): regenerate salvage prop atlas"
          fi
          git rm -r .github/patches
          git rm .github/workflows/materialize-survival-worktree.yml
          git rm .github/workflows/inspect-salvage-test.yml
          git commit -m "chore: remove temporary survival validation scaffolding"
          git status --short
          git push origin HEAD:feat/survival-salvage-modules

      - name: Report validation failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "❌ Final Survival validation failed for \`${GITHUB_SHA::12}\`: ${RUN_URL}. No source implementation was published by this run."
            if [[ -f /tmp/test-sim-current ]]; then
              echo "Simulation file: \`$(cat /tmp/test-sim-current)\`."
            fi
            echo
            echo '```text'
            selected=""
            for file in /tmp/test-client.log /tmp/test-server.log /tmp/test-content.log /tmp/test-protocol.log /tmp/test-sim.log /tmp/build.log; do
              if [[ -f "$file" ]]; then
                selected="$file"
                break
              fi
            done
            if [[ -n "$selected" ]]; then
              sed -E $'s/\x1B\[[0-9;]*[mK]//g' "$selected" | tail -n 180
            else
              echo "Failure occurred before command output was captured."
            fi
            echo '```'
          } > /tmp/failure.md
          gh api --method PATCH repos/dmrs07/voxelyn/issues/comments/5097222729 -F body=@/tmp/failure.md

      - name: Report validation success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "✅ Final Survival validation passed: ${RUN_URL}"
            echo
            echo "All Survival builds, atlas validation, package tests and the offline client build succeeded. Logical source commits are now published on the PR branch."
          } > /tmp/status.md
          gh api --method PATCH repos/dmrs07/voxelyn/issues/comments/5097222729 -F body=@/tmp/status.md
