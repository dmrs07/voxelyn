name: Materialize Survival Worktree

on:
  push:
    branches:
      - feat/survival-salvage-modules

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove git metadata
        run: rm -rf .git
      - name: Upload worktree
        uses: actions/upload-artifact@v4
        with:
          name: voxelyn-worktree
          path: .
          include-hidden-files: true
          retention-days: 1
