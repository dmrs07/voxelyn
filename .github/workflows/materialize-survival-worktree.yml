name: Apply Survival Redesign

on:
  push:
    branches:
      - feat/survival-salvage-modules
  pull_request:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: survival-redesign-apply
  cancel-in-progress: true

jobs:
  apply-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/survival-salvage-modules
          fetch-depth: 0

      - name: Report validation start
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '🔎 Guarded Survival validation started for `%s`: %s\n' "${GITHUB_SHA::12}" "$RUN_URL" > /tmp/status.md
          gh api --method PATCH repos/dmrs07/voxelyn/issues/comments/5097222729 -F body=@/tmp/status.md

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Apply logical slices
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for prefix in 01-sim 02-protocol-server 03-ui-content; do
            cat .github/patches/${prefix}.*.part > "/tmp/${prefix}.patch.gz.b64"
            case "$prefix" in
              01-sim)
                expected="2c7afa3fc6300b73b8c714968eef35b8b05aedb34e492df0b643d67ce23c3f60"
                message="feat(survival): add temporary modules and salvage simulation"
                ;;
              02-protocol-server)
                expected="fc26e4978d5ff097b4ab640bd0ebeab4c64331ad7bfc695f9b0fa7d21b25b4f9"
                message="feat(survival): synchronize per-player choices and world flags"
                ;;
              03-ui-content)
                expected="eda0ca30411e0e7982c3af3ebe0dcbdf359352e4083280aaa7b36c0345fe059d"
                message="feat(survival-ui): add salvage props, reward choice and module HUD"
                ;;
            esac
            echo "$expected  /tmp/${prefix}.patch.gz.b64" | sha256sum --check
            base64 --decode "/tmp/${prefix}.patch.gz.b64" | gzip --decompress > "/tmp/${prefix}.patch"
            git apply --index "/tmp/${prefix}.patch"
            git commit -m "$message"
          done

      - name: Apply deterministic fixture corrections
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          cells_path = Path('packages/voxelyn-survival-sim/src/cells.ts')
          cells = cells_path.read_text()
          event = "  events.push({ t: 'discharge', cells, ...origin });"
          duplicate = f"{event}\n{event}"
          if duplicate in cells:
              cells = cells.replace(duplicate, event, 1)
              cells_path.write_text(cells)
          elif cells.count(event) != 1:
              raise SystemExit('Unexpected discharge event shape in cells.ts')

          reactions_path = Path('packages/voxelyn-survival-sim/tests/reactions.test.ts')
          reactions = reactions_path.read_text()
          vent_filter = "  state.vents = state.vents.filter((vent) => vent.x < x0 || vent.x > x1 || vent.y < y0 || vent.y > y1);"
          if vent_filter not in reactions:
              needle = "  }\n};\n\nconst tickCells"
              replacement = (
                  "  }\n"
                  "  // Um cenário controlado não pode receber emissões de vents gerados pela seed.\n"
                  f"{vent_filter}\n"
                  "};\n\nconst tickCells"
              )
              if needle not in reactions:
                  raise SystemExit('Unexpected clearArea shape in reactions.test.ts')
              reactions = reactions.replace(needle, replacement, 1)
              reactions_path.write_text(reactions)

          salvage_path = Path('packages/voxelyn-survival-sim/tests/salvage-modules.test.ts')
          salvage = salvage_path.read_text()

          siphon_spawn = "    const enemy = spawnEnemy(state, 'bruiser', state.player.x + 0.2, state.player.y, false);"
          siphon_fixture = (
              f"{siphon_spawn}\n"
              "    enemy.x = state.player.x + 0.2;\n"
              "    enemy.y = state.player.y;\n"
              "    enemy.stunnedUntil = Number.MAX_SAFE_INTEGER;"
          )
          if "enemy.stunnedUntil = Number.MAX_SAFE_INTEGER;" not in salvage:
              if siphon_spawn not in salvage:
                  raise SystemExit('Unexpected siphon fixture shape in salvage-modules.test.ts')
              salvage = salvage.replace(siphon_spawn, siphon_fixture, 1)

          explosive_before = "    spawnEnemy(before, 'bruiser', before.player.x, before.player.y, false);"
          explosive_before_fixture = (
              "    const beforeEnemy = spawnEnemy(before, 'bruiser', before.player.x, before.player.y, false);\n"
              "    beforeEnemy.x = before.player.x;\n"
              "    beforeEnemy.y = before.player.y;\n"
              "    beforeEnemy.stunnedUntil = Number.MAX_SAFE_INTEGER;"
          )
          if "beforeEnemy.stunnedUntil = Number.MAX_SAFE_INTEGER;" not in salvage:
              if explosive_before not in salvage:
                  raise SystemExit('Unexpected pre-arm explosive fixture shape')
              salvage = salvage.replace(explosive_before, explosive_before_fixture, 1)

          explosive_armed = "    spawnEnemy(armed, 'bruiser', armed.player.x, armed.player.y, false);"
          explosive_armed_fixture = (
              "    const armedEnemy = spawnEnemy(armed, 'bruiser', armed.player.x, armed.player.y, false);\n"
              "    armedEnemy.x = armed.player.x;\n"
              "    armedEnemy.y = armed.player.y;\n"
              "    armedEnemy.stunnedUntil = Number.MAX_SAFE_INTEGER;"
          )
          if "armedEnemy.stunnedUntil = Number.MAX_SAFE_INTEGER;" not in salvage:
              if explosive_armed not in salvage:
                  raise SystemExit('Unexpected armed explosive fixture shape')
              salvage = salvage.replace(explosive_armed, explosive_armed_fixture, 1)

          terminal_loop = "    while (state.tick < first.scanEndsAt) stepRun(state, [emptyCommand()]);"
          terminal_fixture = (
              "    while (state.tick < first.scanEndsAt) {\n"
              "      state.enemies = [];\n"
              "      state.player.hp = state.player.maxHp;\n"
              "      stepRun(state, [emptyCommand()]);\n"
              "    }"
          )
          if "state.player.hp = state.player.maxHp;" not in salvage:
              if terminal_loop not in salvage:
                  raise SystemExit('Unexpected terminal scan loop shape')
              salvage = salvage.replace(terminal_loop, terminal_fixture, 1)

          salvage_path.write_text(salvage)
          PY
          git add \
            packages/voxelyn-survival-sim/src/cells.ts \
            packages/voxelyn-survival-sim/tests/reactions.test.ts \
            packages/voxelyn-survival-sim/tests/salvage-modules.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix(survival): isolate module, scan and reaction fixtures"
          fi

      - name: Build core for content tools
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @voxelyn/core build 2>&1 | tee /tmp/build.log

      - name: Generate content atlases
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @voxelyn/survival-content generate 2>&1 | tee /tmp/generate.log

      - name: Diagnose salvage module tests
        timeout-minutes: 5
        shell: bash
        env:
          NO_COLOR: '1'
          FORCE_COLOR: '0'
        run: |
          set -o pipefail
          cd packages/voxelyn-survival-sim
          echo 'tests/salvage-modules.test.ts' > /tmp/test-sim-current
          timeout 120s pnpm exec vitest run tests/salvage-modules.test.ts --reporter=verbose 2>&1 | tee /tmp/test-sim.log

      - name: Test remaining simulation files
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          cd packages/voxelyn-survival-sim
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.ts' ! -name 'salvage-modules.test.ts' | sort)
          for file in "${files[@]}"; do
            echo "$file" > /tmp/test-sim-current
            timeout 90s pnpm exec vitest run "$file" --reporter=verbose 2>&1 | tee /tmp/test-sim.log
          done

      - name: Test protocol
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @voxelyn/survival-protocol test 2>&1 | tee /tmp/test-protocol.log

      - name: Test content pipeline
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @voxelyn/survival-content test 2>&1 | tee /tmp/test-content.log

      - name: Test server and co-op
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @voxelyn/survival-server test 2>&1 | tee /tmp/test-server.log

      - name: Test client and layout
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @voxelyn/survival test 2>&1 | tee /tmp/test-client.log

      - name: Commit generated assets and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add packages/voxelyn-survival-content/assets/atlases/world-props.json \
                  packages/voxelyn-survival-content/assets/atlases/world-props.png \
                  packages/voxelyn-survival-content/assets/atlases/index.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(survival-content): regenerate salvage prop atlas"
          fi
          git rm -r .github/patches
          git rm .github/workflows/materialize-survival-worktree.yml
          git commit -m "chore: remove temporary survival workflow"
          git push origin HEAD:feat/survival-salvage-modules

      - name: Report validation failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "❌ Guarded Survival validation failed for \`${GITHUB_SHA::12}\`: ${RUN_URL}. No source implementation was pushed."
            if [[ -f /tmp/test-sim-current ]]; then
              echo "Arquivo corrente: \`$(cat /tmp/test-sim-current)\`."
            fi
            echo
            echo '```text'
            selected=""
            for file in /tmp/test-client.log /tmp/test-server.log /tmp/test-content.log /tmp/test-protocol.log /tmp/test-sim.log /tmp/generate.log /tmp/build.log; do
              if [[ -f "$file" ]]; then
                selected="$file"
                break
              fi
            done
            if [[ -n "$selected" ]]; then
              sed -E $'s/\x1B\[[0-9;]*[mK]//g' "$selected" | tail -n 140
            else
              echo "Failure occurred before command output was captured."
            fi
            echo '```'
          } > /tmp/failure.md
          gh api --method PATCH repos/dmrs07/voxelyn/issues/comments/5097222729 -F body=@/tmp/failure.md

      - name: Report validation success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '✅ Guarded Survival validation passed: %s. Atlas generation and all Survival package suites succeeded; the logical source commits are now on this PR.\n' "$RUN_URL" > /tmp/status.md
          gh api --method PATCH repos/dmrs07/voxelyn/issues/comments/5097222729 -F body=@/tmp/status.md
