name: Validate voxel character spec

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: voxel-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build typed dependencies
        run: pnpm --filter @voxelyn/survival-server... build

      - name: Apply projectile-cause integrity fix
        run: python .github/scripts/death-echo-review-fixes.py capsules

      - name: Validate projectile-cause commit
        run: |
          pnpm --filter @voxelyn/survival exec tsc -p tsconfig.json
          pnpm test:survival
          git diff --check

      - name: Commit projectile-cause integrity fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/voxelyn-survival/src/client/death-echoes.ts \
            packages/voxelyn-survival/src/client/death-echoes.test.ts
          git commit -m "fix(survival): validate enemy projectile death causes"

      - name: Apply responsive readout fix
        run: python .github/scripts/death-echo-review-fixes.py layout

      - name: Validate final product state
        run: |
          pnpm --filter @voxelyn/survival exec tsc -p tsconfig.json
          pnpm build:survival
          pnpm test:survival
          pnpm --filter @voxelyn/survival build:offline-check
          git diff --check

      - name: Commit responsive readout fix
        run: |
          git add \
            packages/voxelyn-survival/src/client/death-echo-presentation.ts \
            packages/voxelyn-survival/src/client/death-echo-presentation.test.ts \
            packages/voxelyn-survival/src/client/render.ts
          git commit -m "fix(survival): keep death echo readout clear of HUD"

      - name: Remove review transport
        run: |
          git checkout origin/main -- .github/workflows/execute-voxel-spec.yml
          rm .github/scripts/death-echo-review-fixes.py
          git add -A .github
          git commit -m "chore(ci): remove death echo review transport"

      - name: Publish reviewed commits
        run: git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
