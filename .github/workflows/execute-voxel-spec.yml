name: Execute voxel character spec

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: voxel-spec-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Initialize execution log
        run: |
          : > /tmp/voxel-execution.log

      - name: Install dependencies
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee -a /tmp/voxel-execution.log

      - name: Reassemble implementation script
        run: cat scripts/apply_voxel_spec.py.part* > scripts/apply_voxel_spec.py

      - name: Apply reviewed voxel specification
        run: |
          set -o pipefail
          python3 scripts/apply_voxel_spec.py 2>&1 | tee -a /tmp/voxel-execution.log

      - name: Remove transport fragments
        run: rm -f scripts/apply_voxel_spec.py scripts/apply_voxel_spec.py.part* scripts/voxel_bundle.part* .github/voxel-spec-trigger .github/voxel-failure.log

      - name: Generate character atlases
        run: |
          set -o pipefail
          pnpm --filter @voxelyn/survival-content generate 2>&1 | tee -a /tmp/voxel-execution.log

      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
          else
            git commit -m "feat(survival): implement voxel character spec [voxel-spec-applied]"
            git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
          fi

      - name: Validate and test survival packages
        run: |
          set -o pipefail
          pnpm test:survival 2>&1 | tee -a /tmp/voxel-execution.log

      - name: Build survival packages
        run: |
          set -o pipefail
          pnpm build:survival 2>&1 | tee -a /tmp/voxel-execution.log

      - name: Verify PWA atlas precache
        run: |
          set -o pipefail
          pnpm --filter @voxelyn/survival build:offline-check 2>&1 | tee -a /tmp/voxel-execution.log

      - name: Report execution failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### Falha ao validar a implementação da spec voxel'
            echo
            echo 'A implementação foi persistida no branch para correção.'
            echo
            echo '```text'
            tail -n 160 /tmp/voxel-execution.log
            echo '```'
          } > /tmp/voxel-failure.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/voxel-failure.md
