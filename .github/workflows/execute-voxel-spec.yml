name: Validate voxel character spec

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: voxel-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate normalized character atlases
        run: pnpm --filter @voxelyn/survival-content generate

      - name: Persist regenerated atlases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/voxelyn-survival-content/assets/atlases
          if git diff --cached --quiet; then
            echo "Atlases already up to date."
          else
            git commit -m "fix(content): regenerate normalized voxel atlases [skip voxel]"
            git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
          fi

      - name: Build survival packages
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm build:survival 2>&1 | tee /tmp/voxel-validation.log

      - name: Validate and test survival packages
        id: tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm test:survival 2>&1 | tee -a /tmp/voxel-validation.log

      - name: Verify PWA atlas precache
        id: offline
        if: steps.build.outcome == 'success' && steps.tests.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --filter @voxelyn/survival build:offline-check 2>&1 | tee -a /tmp/voxel-validation.log

      - name: Write validation summary
        if: always()
        run: |
          {
            echo "build=${{ steps.build.outcome }}"
            echo "tests=${{ steps.tests.outcome }}"
            echo "offline=${{ steps.offline.outcome }}"
            echo
            cat /tmp/voxel-validation.log
          } > /tmp/voxel-validation-full.log

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voxel-validation-${{ github.run_id }}
          path: /tmp/voxel-validation-full.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce validation result
        if: steps.build.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.offline.outcome == 'failure'
        run: exit 1
