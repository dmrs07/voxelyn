name: Export Reconstructed Bruiser Patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bruiser-gorilla-conductive-stun
  cancel-in-progress: true

jobs:
  export-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bruiser-gorilla-conductive-stun
          fetch-depth: 0
          show-progress: false

      - name: Reconstruct runner patch
        shell: bash
        run: |
          {
            head -c 18000 .github/patches/bruiser.patch.b64.part00
            cat .github/patches/bruiser.patch.b64.part01
          } | base64 --decode > /tmp/bruiser-runner.patch
          wc -c /tmp/bruiser-runner.patch
          sha256sum /tmp/bruiser-runner.patch

      - uses: actions/upload-artifact@v4
        with:
          name: bruiser-reconstructed-patch
          path: /tmp/bruiser-runner.patch
          retention-days: 1
