name: Diagnose Bruiser Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: bruiser-gorilla-conductive-stun
  cancel-in-progress: true

jobs:
  diagnose-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bruiser-gorilla-conductive-stun
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Apply guarded implementation patch
        shell: bash
        run: |
          set -euo pipefail
          {
            head -c 18000 .github/patches/bruiser.patch.b64.part00
            cat .github/patches/bruiser.patch.b64.part01
          } | base64 --decode > /tmp/bruiser.patch
          python <<'PY'
          from pathlib import Path
          path = Path('/tmp/bruiser.patch')
          text = path.read_text()
          assert text[24745] == '*'
          text = text[:24745] + ':' + text[24746:]
          assert text[17651] == 'i'
          text = text[:17651] + 'e' + text[17652:]
          assert text[13495] == '_'
          text = text[:13495] + text[13496:]
          text = text[:12511] + ' ' + text[12511:]
          path.write_text(text)
          PY
          echo '4ff4606b03b654e22550b3ef842007b5f6c5f96e04e63f3829d061b47b41ac36  /tmp/bruiser.patch' | sha256sum --check
          git apply --index /tmp/bruiser.patch

      - name: Run build chain and report exact failure
        shell: bash
        run: |
          set +e
          status=0
          run_step() {
            local label="$1"
            shift
            echo "### $label"
            "$@"
            status=$?
            return "$status"
          }
          {
            run_step 'core build' pnpm --filter @voxelyn/core build || true
            if [ "$status" -eq 0 ]; then run_step 'simulation build' pnpm --filter @voxelyn/survival-sim build || true; fi
            if [ "$status" -eq 0 ]; then run_step 'protocol build' pnpm --filter @voxelyn/survival-protocol build || true; fi
            if [ "$status" -eq 0 ]; then run_step 'content generate' pnpm --filter @voxelyn/survival-content generate || true; fi
            if [ "$status" -eq 0 ]; then run_step 'content validate' pnpm --filter @voxelyn/survival-content validate || true; fi
            if [ "$status" -eq 0 ]; then run_step 'content build' pnpm --filter @voxelyn/survival-content build || true; fi
            if [ "$status" -eq 0 ]; then run_step 'server build' pnpm --filter @voxelyn/survival-server build || true; fi
            if [ "$status" -eq 0 ]; then run_step 'offline build' pnpm --filter @voxelyn/survival build:offline-check || true; fi
          } > /tmp/bruiser-build.log 2>&1
          {
            echo '## Bruiser build diagnostic'
            echo
            echo "- exit status: \`$status\`"
            echo
            echo '```text'
            tail -n 120 /tmp/bruiser-build.log
            echo '```'
          } > /tmp/bruiser-build-comment.md
          cat /tmp/bruiser-build-comment.md
          gh pr comment 51 --body-file /tmp/bruiser-build-comment.md
          exit "$status"
        env:
          GH_TOKEN: ${{ github.token }}
