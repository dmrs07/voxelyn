name: Diagnose Bruiser Patch Transport

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: bruiser-gorilla-conductive-stun
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bruiser-gorilla-conductive-stun
          fetch-depth: 0
          show-progress: false

      - name: Reconstruct and diagnose patch
        id: diagnose
        shell: bash
        run: |
          set +e
          part0=$(wc -c < .github/patches/bruiser.patch.b64.part00)
          part1=$(wc -c < .github/patches/bruiser.patch.b64.part01)
          cat .github/patches/bruiser.patch.b64.part00 \
              .github/patches/bruiser.patch.b64.part01 \
            | base64 --decode > /tmp/bruiser.patch
          decode_status=$?
          decoded=$(wc -c < /tmp/bruiser.patch)
          sha=$(sha256sum /tmp/bruiser.patch | cut -d' ' -f1)
          apply_output=$(git apply --check /tmp/bruiser.patch 2>&1)
          apply_status=$?
          {
            echo '## Bruiser patch transport diagnostic'
            echo
            echo "- part00 bytes: \`$part0\` (expected \`18000\`)"
            echo "- part01 bytes: \`$part1\` (expected \`16560\`)"
            echo "- decoded bytes: \`$decoded\` (expected \`25919\`)"
            echo "- decoded SHA-256: \`$sha\`"
            echo "- expected SHA-256: \`4ff4606b03b654e22550b3ef842007b5f6c5f96e04e63f3829d061b47b41ac36\`"
            echo "- base64 status: \`$decode_status\`"
            echo "- git apply status: \`$apply_status\`"
            if [ -n "$apply_output" ]; then
              echo
              echo '```text'
              printf '%s\n' "$apply_output"
              echo '```'
            fi
          } > /tmp/diagnostic.md
          cat /tmp/diagnostic.md
          gh pr comment 51 --body-file /tmp/diagnostic.md
          test "$decode_status" -eq 0
          test "$sha" = '4ff4606b03b654e22550b3ef842007b5f6c5f96e04e63f3829d061b47b41ac36'
          test "$apply_status" -eq 0
        env:
          GH_TOKEN: ${{ github.token }}
