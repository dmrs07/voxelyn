<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxelyn Survival - Sprite Viewer</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #0b0e14;
        color: #b8a98f;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        padding: 16px;
      }
      h1 {
        color: #59f2c2;
        font-size: 18px;
      }
      .controls {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 16px;
        font-size: 13px;
      }
      .controls label {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
      }
      .cell {
        border: 1px solid #2e3a4d;
        border-radius: 6px;
        padding: 10px;
        background: #11151d;
      }
      .cell h3 {
        margin: 0 0 4px;
        font-size: 12px;
        color: #e8f1ff;
      }
      .cell .meta {
        font-size: 10px;
        color: #6e7a90;
        margin-bottom: 6px;
      }
      canvas {
        image-rendering: pixelated;
        display: block;
        border-radius: 4px;
      }
      button,
      select {
        background: #1d2430;
        color: #b8a98f;
        border: 1px solid #2e3a4d;
        border-radius: 4px;
        padding: 4px 8px;
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <h1>Voxelyn Survival — Sprite Viewer</h1>
    <div class="controls">
      <label>Zoom <select id="zoom"><option>4</option><option selected>6</option><option>8</option><option>10</option></select></label>
      <label>Fundo <select id="bg"><option value="#0b0e14">escuro</option><option value="#b8a98f">claro</option><option value="#2f6b4f">fungo</option></select></label>
      <label>Vel <input id="speed" type="range" min="0.25" max="2" step="0.25" value="1" /></label>
      <label><input id="hitbox" type="checkbox" /> hitbox</label>
      <label><input id="anchor" type="checkbox" checked /> anchor</label>
      <label>Dir <select id="dir"><option>dr</option><option>dl</option><option>ur</option><option>ul</option><option>n</option></select></label>
    </div>
    <div class="grid" id="grid"></div>
    <script type="module" src="./src/client/sprite-viewer.ts"></script>
  </body>
</html>
