<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b0e14" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Voxelyn Survival</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0e14;
        color: #e8f1ff;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated;
      }
      .overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: rgba(11, 14, 20, 0.92);
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        z-index: 10;
      }
      .hidden {
        display: none !important;
      }
      h1 {
        color: #59f2c2;
        margin: 0;
        font-size: clamp(20px, 5vw, 34px);
        letter-spacing: 2px;
      }
      .sub {
        color: #b8a98f;
        font-size: 12px;
        margin-top: -8px;
      }
      button {
        background: #1d2430;
        color: #e8f1ff;
        border: 1px solid #2e3a4d;
        border-radius: 8px;
        padding: 12px 22px;
        font-family: inherit;
        font-size: 15px;
        min-width: 220px;
      }
      button.primary {
        border-color: #59f2c2;
        color: #59f2c2;
      }
      button:active {
        background: #2e3a4d;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 12px;
        color: #b8a98f;
      }
      input,
      select {
        background: #11151d;
        color: #e8f1ff;
        border: 1px solid #2e3a4d;
        border-radius: 6px;
        padding: 8px;
        font-family: inherit;
      }
      #banner {
        position: fixed;
        top: calc(6px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        background: rgba(217, 59, 76, 0.9);
        color: #fff;
        padding: 6px 14px;
        border-radius: 6px;
        font-size: 12px;
        z-index: 20;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="menu" class="overlay">
      <h1>VOXELYN SURVIVAL</h1>
      <div class="sub">o Veio está vivo — sobreviva</div>
      <button id="btn-solo" class="primary">Descer sozinho</button>
      <button id="btn-online">Co-op online (2 jogadores)</button>
      <div class="row">
        <label for="server">Servidor</label>
        <input id="server" size="22" placeholder="auto" />
      </div>
      <div class="row">
        <label for="quality">Qualidade</label>
        <select id="quality">
          <option value="high">Alta</option>
          <option value="medium">Média</option>
          <option value="low">Baixa (30 FPS)</option>
        </select>
      </div>
      <div class="sub">Toque para jogar · WASD/mouse no desktop · R reinicia</div>
    </div>

    <div id="banner" class="hidden"></div>

    <script type="module" src="./src/client/main.ts"></script>
  </body>
</html>
