<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b0e14" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Voxelyn Survival</title>
    <style>
      :root {
        color-scheme: dark;
        --safe-area-inset-top: env(safe-area-inset-top, 0px);
        --safe-area-inset-right: env(safe-area-inset-right, 0px);
        --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
        --safe-area-inset-left: env(safe-area-inset-left, 0px);
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0e14;
        color: #e8f1ff;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated;
      }
      .overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: rgba(11, 14, 20, 0.92);
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        z-index: 10;
      }
      .hidden {
        display: none !important;
      }
      h1 {
        color: #59f2c2;
        margin: 0;
        font-size: clamp(20px, 5vw, 34px);
        letter-spacing: 2px;
      }
      .sub {
        color: #b8a98f;
        font-size: 12px;
        margin-top: -8px;
      }
      button {
        background: #1d2430;
        color: #e8f1ff;
        border: 1px solid #2e3a4d;
        border-radius: 8px;
        padding: 12px 22px;
        font-family: inherit;
        font-size: 15px;
        min-width: 220px;
      }
      button.primary {
        border-color: #59f2c2;
        color: #59f2c2;
      }
      button.compact {
        min-width: 0;
        padding: 8px 12px;
        font-size: 12px;
      }
      .sub.warn {
        color: #7f8da3;
        margin-top: -4px;
      }
      input[type='range'] {
        padding: 0;
        width: 110px;
        accent-color: #59f2c2;
      }
      /* O painel rola por dentro: em landscape de celular a lista de
         descobertas passa da altura da tela, e o body nunca rola. */
      .panel {
        width: min(560px, 92vw);
        max-height: 58vh;
        overflow-y: auto;
        font-size: 12px;
        line-height: 1.55;
        color: #b8a98f;
        background: #11151d;
        border: 1px solid #2e3a4d;
        border-radius: 8px;
        padding: 14px 16px;
      }
      .panel h2 {
        color: #59f2c2;
        font-size: 12px;
        letter-spacing: 1px;
        margin: 14px 0 6px;
      }
      .panel h2:first-child {
        margin-top: 0;
      }
      .panel dl {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 12px;
        margin: 0;
      }
      .panel dd {
        margin: 0;
        color: #e8f1ff;
        text-align: right;
      }
      .panel .locked {
        color: #46566e;
      }
      .panel .lesson {
        display: block;
        color: #7f8da3;
        margin-bottom: 6px;
      }
      .panel .found {
        color: #e8f1ff;
      }
      button:active {
        background: #2e3a4d;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 12px;
        color: #b8a98f;
      }
      input,
      select {
        background: #11151d;
        color: #e8f1ff;
        border: 1px solid #2e3a4d;
        border-radius: 6px;
        padding: 8px;
        font-family: inherit;
      }
      #banner {
        position: fixed;
        top: calc(6px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        background: rgba(217, 59, 76, 0.9);
        color: #fff;
        padding: 6px 14px;
        border-radius: 6px;
        font-size: 12px;
        z-index: 20;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="menu" class="overlay">
      <h1>VOXELYN SURVIVAL</h1>
      <div class="sub">o Veio está vivo — sobreviva</div>
      <button id="btn-solo" class="primary">Descer sozinho</button>
      <button id="btn-online">Co-op online (2 jogadores)</button>
      <div class="row">
        <label for="room">Sala</label>
        <input id="room" size="6" maxlength="9" placeholder="código" />
        <span class="sub" id="room-hint">vazio = qualquer sala</span>
      </div>
      <div class="row">
        <label for="server">Servidor</label>
        <input id="server" size="22" placeholder="auto" />
      </div>
      <div class="row">
        <label for="quality">Qualidade</label>
        <select id="quality">
          <option value="high">Alta</option>
          <option value="medium">Média</option>
          <option value="low">Baixa (30 FPS)</option>
        </select>
      </div>
      <div class="row">
        <label for="volume">Volume</label>
        <input id="volume" type="range" min="0" max="100" step="1" />
        <button id="btn-mute" class="compact primary">Som: ligado</button>
      </div>
      <div class="row">
        <label for="seed">Seed</label>
        <input id="seed" size="12" placeholder="aleatória" />
        <button id="btn-records" class="compact">Registro</button>
      </div>
      <div class="row">
        <label for="name">Nome</label>
        <input id="name" size="12" maxlength="18" placeholder="anônimo" />
        <button id="btn-rank" class="compact">Ranking</button>
      </div>
      <div class="sub">Toque para jogar · WASD/mouse no desktop · R reinicia · M silencia</div>
      <div class="row">
        <button id="btn-telemetry" class="compact">Telemetria: ligada</button>
        <span class="sub">dados anônimos de sessão, sem identificação</span>
      </div>
      <div class="sub warn">Use fones: o som avisa o que a tela ainda não mostra.</div>
    </div>

    <div id="records" class="overlay hidden">
      <h1>REGISTRO</h1>
      <div id="records-body" class="panel"></div>
      <button id="btn-records-close" class="primary">Voltar</button>
    </div>

    <div id="rank" class="overlay hidden">
      <h1>RANKING</h1>
      <div id="rank-body" class="panel"></div>
      <button id="btn-rank-close" class="primary">Voltar</button>
    </div>

    <div id="banner" class="hidden"></div>

    <script type="module" src="./src/client/main.ts"></script>
  </body>
</html>
