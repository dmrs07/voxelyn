<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Voxelyn Survival — Replay</title>
    <style>
      :root {
        color-scheme: dark;
        --safe-area-inset-top: env(safe-area-inset-top, 0px);
        --safe-area-inset-right: env(safe-area-inset-right, 0px);
        --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
        --safe-area-inset-left: env(safe-area-inset-left, 0px);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0a0b;
        color: #d8cfc0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: #000;
      }
      .hidden {
        display: none !important;
      }
      #status {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        background: radial-gradient(circle at 50% 20%, #14151b 0%, #08090b 70%);
      }
      #status .panel {
        max-width: 420px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      #status h1 {
        margin: 0;
        font-size: 16px;
        color: #59f2c2;
        letter-spacing: 0.04em;
      }
      #status p {
        margin: 0;
        font-size: 13px;
        color: #b8a98f;
      }
      #status a {
        color: #59f2c2;
      }
      #hud-note {
        position: fixed;
        top: calc(8px + var(--safe-area-inset-top));
        left: calc(8px + var(--safe-area-inset-left));
        font-size: 11px;
        color: #7c8290cc;
        z-index: 5;
        pointer-events: none;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      #playbar {
        position: fixed;
        left: calc(8px + var(--safe-area-inset-left));
        right: calc(8px + var(--safe-area-inset-right));
        bottom: calc(8px + var(--safe-area-inset-bottom));
        z-index: 6;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        background: rgba(10, 11, 13, 0.78);
        border: 1px solid #2a2d38;
        border-radius: 8px;
        backdrop-filter: blur(2px);
      }
      #playbar button {
        font: inherit;
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid #333748;
        background: #191c24;
        color: #e8e2d6;
        cursor: pointer;
        flex: 0 0 auto;
      }
      #playbar button:hover {
        border-color: #59f2c2;
      }
      #scrub {
        flex: 1 1 auto;
        min-width: 0;
        accent-color: #59f2c2;
      }
      #clock {
        flex: 0 0 auto;
        font-size: 11px;
        color: #b8a98f;
        min-width: 6.5ch;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <canvas id="game" class="hidden"></canvas>
    <div id="hud-note" class="hidden" data-i18n="replay.badge"></div>

    <div id="status">
      <div class="panel">
        <h1 id="status-title" data-i18n="replay.loading.title"></h1>
        <p id="status-detail"></p>
        <p><a href="./index.html" data-i18n="replay.back"></a></p>
      </div>
    </div>

    <div id="playbar" class="hidden">
      <button id="btn-toggle" type="button" data-i18n="replay.pause"></button>
      <input id="scrub" type="range" min="0" max="0" value="0" step="1" />
      <span id="clock">0:00</span>
      <button id="btn-restart" type="button" data-i18n="replay.restart"></button>
    </div>

    <script type="module" src="./src/client/replay-main.ts"></script>
  </body>
</html>
